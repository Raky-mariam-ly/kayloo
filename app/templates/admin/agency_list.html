{% extends "list.html" %}

{% block head_css %}
{{ super() }}
<style>
@media (max-width: 767.98px) {

  /* Avatar */
  table#dt tbody tr td.a-td-avatar {
    display: flex !important;
    flex: 0 0 auto;
  }

  /* Info */
  table#dt tbody tr td.a-td-info {
    display: flex !important;
    flex: 1 1 0;
    flex-direction: column;
    min-width: 0;
    overflow: hidden;
    gap: .1rem;
  }

  /* Actions */
  table#dt tbody tr td.a-td-actions {
    display: flex !important;
    flex: 0 0 auto;
    margin-left: auto;
    align-items: center;
    gap: .15rem;
  }
  table#dt tbody tr td.a-td-actions .btn {
    padding: .28rem .38rem !important;
    font-size: .78rem !important;
  }
  table#dt tbody tr td.a-td-actions .btn span { display: none !important; }

  /* ── Avatar ── */
  .a-avatar {
    width: 38px; height: 38px;
    border-radius: 10px;
    background: #f8f9fa;
    color: #1a1a2e;
    border: 1px solid #dee2e6;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: .85rem;
    flex-shrink: 0;
  }
  .a-avatar--logo { padding: 0; overflow: hidden; background: #fff; }
  .a-avatar--logo img { width: 100%; height: 100%; object-fit: contain; padding: 4px; }

  /* ── Card text ── */
  .a-card-name    { font-weight: 600; font-size: .86rem; color: #1a1a2e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .a-card-sub     { font-size: .74rem; color: #868e96; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .a-card-bottom  { display: flex; align-items: center; gap: .4rem; flex-wrap: wrap; margin-top: .05rem; }
  .a-card-country { display: inline-block; font-size: .67rem; font-weight: 600; background: #f1f3f5; color: #495057; padding: .08rem .32rem; border-radius: 4px; }
  .a-card-status  { display: inline-flex; align-items: center; gap: .25rem; font-size: .68rem; font-weight: 600; }
  .a-card-dot     { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; display: inline-block; }
}
</style>
{% endblock %}

{% block script %}
{{ super() }}
<script>
(function () {
  function buildCards() {
    if (window.innerWidth >= 768) return;
    var dt = $('#dt').DataTable();

    $('#dt tbody tr').each(function () {
      var $tr = $(this);
      $tr.find('.a-td-avatar, .a-td-info, .a-td-actions').remove();

      var data = dt.row(this).data();
      if (!data) return;

      var name     = data.name         || '—';
      var email    = data.email        || '';
      var phone    = data.phone_number || '';
      var country  = data.country      || '';
      var isActive = data.is_active;
      var initial  = name.charAt(0).toUpperCase();

      var dotColor  = isActive ? '#28a745' : '#dc3545';
      var dotLabel  = isActive ? 'Actif' : 'Inactif';

      /* Extract logo src from ImageField HTML rendered by starlette-admin */
      function extractLogoSrc(raw) {
        if (!raw) return null;
        if (typeof raw === 'string') {
          var m = raw.match(/src="([^"]+)"/);
          if (m) return m[1];
        }
        return null;
      }

      /* Avatar — logo if available, initials otherwise */
      var logoSrc = extractLogoSrc(data.logo_url);
      var $avatar;
      if (logoSrc) {
        $avatar = $('<td class="a-td-avatar"></td>').html(
          '<div class="a-avatar a-avatar--logo"><img src="' + logoSrc + '" alt="' + esc(name) + '"></div>'
        );
      } else {
        $avatar = $('<td class="a-td-avatar"></td>').append(
          $('<div class="a-avatar"></div>').text(initial)
        );
      }

      /* Info */
      var $info = $('<td class="a-td-info"></td>').html(
        '<div class="a-card-name">' + esc(name) + '</div>' +
        (email ? '<div class="a-card-sub">' + esc(email) + '</div>' : '') +
        (phone ? '<div class="a-card-sub">' + esc(phone) + '</div>' : '') +
        '<div class="a-card-bottom">' +
          (country ? '<span class="a-card-country">' + esc(country) + '</span>' : '') +
          '<span class="a-card-status" style="color:' + dotColor + ';">' +
            '<span class="a-card-dot" style="background:' + dotColor + ';"></span>' +
            dotLabel +
          '</span>' +
        '</div>'
      );

      var $actions = buildVerticalActions($tr, 'a-td-actions');

      var $chk = $tr.find('td:nth-child(1)');
      $chk.after($actions);
      $chk.after($info);
      $chk.after($avatar);
    });
  }

  function destroyCards() {
    $('#dt tbody tr').find('.a-td-avatar, .a-td-info, .a-td-actions').remove();
  }

  $(document).on('draw.dt', '#dt', buildCards);
  $(window).on('load', function () { setTimeout(buildCards, 300); });

  var _rt;
  $(window).on('resize', function () {
    clearTimeout(_rt);
    _rt = setTimeout(function () {
      if (window.innerWidth >= 768) destroyCards();
      else buildCards();
    }, 120);
  });
})();
</script>
{% endblock %}
