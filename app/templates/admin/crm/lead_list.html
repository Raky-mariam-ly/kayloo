{% extends "list.html" %}

{% block head_css %}
{{ super() }}
<style>
    /* Lead status badges in the DataTable */
    .lead-badge-new         { background: #e8f4f8; color: #0ca678; }
    .lead-badge-contacted   { background: #e0f0ff; color: #206bc4; }
    .lead-badge-qualified   { background: #e8e0ff; color: #6654a4; }
    .lead-badge-negotiation { background: #f0e0ff; color: #9654a4; }
    .lead-badge-won         { background: #d2f4e8; color: #2fb344; }
    .lead-badge-lost        { background: #fde0e0; color: #d63939; }

    .lead-badge {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 100px;
        font-size: .8125rem;
        font-weight: 600;
    }

    .priority-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 4px;
    }
    .priority-dot-low      { background: #a0aec0; }
    .priority-dot-medium   { background: #f59f00; }
    .priority-dot-high     { background: #fd7e14; }
    .priority-dot-urgent   { background: #d63939; }
</style>
{% endblock %}

{% block header %}
<div class="d-flex justify-content-between align-items-center">
    <div>
        <h2 class="page-title">
            <i class="fa fa-funnel-dollar me-2" style="color: var(--tblr-primary)"></i>
            Leads
        </h2>
        <div class="text-muted mt-1">Gestion du pipeline commercial</div>
    </div>
    <div class="d-flex align-items-center gap-2">
        <a href="/admin/crm-kanban" class="btn btn-sm btn-outline-primary">
            <i class="fa fa-columns me-1"></i>Vue Kanban
        </a>
        <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item">
                <a href="{{ url_for(__name__ ~ ':index') }}">Admin</a>
            </li>
            <li class="breadcrumb-item">CRM</li>
            <li class="breadcrumb-item active">Leads</li>
        </ol>
    </div>
</div>
{% endblock %}
