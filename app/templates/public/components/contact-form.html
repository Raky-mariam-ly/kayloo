{% macro section() %}
<section id="contact-section" class="pb-[45px] pt-[45px]">
            <div class="max-w-site mx-auto px-4">
                <div
                    class="border border-border-light rounded-lg overflow-hidden bg-contact-outer flex flex-col lg:flex-row">

                    <!-- Left: Contact info (dark panel) -->
                    <div class="w-full lg:w-1/2 bg-contact-left p-[8%] lg:p-[4%] space-y-[30px] flex flex-col gap-4">
                        <h2 class="font-poppins text-white text-[26px] lg:text-[24px] font-bold leading-[1.7em] m-0">
                            Pour toute demande de devis, n'hésitez pas à nous contacter.
                        </h2>

                        <ul class="list-none p-0 m-0 space-y-[6px]">
                            <li>
                                <a href="#"
                                    class="flex items-start gap-3 text-white no-underline hover:text-hover-blue transition text-base">
                                    <svg class="w-[17px] h-[17px] flex-shrink-0 mt-0.5" viewBox="0 0 384 512"
                                        fill="currentColor">
                                        <path
                                            d="M172.268 501.67C26.97 291.031 0 269.413 0 192 0 85.961 85.961 0 192 0s192 85.961 192 192c0 77.413-26.97 99.031-172.268 309.67-9.535 13.774-29.93 13.773-39.464 0zM192 272c44.183 0 80-35.817 80-80s-35.817-80-80-80-80 35.817-80 80 35.817 80 80 80z" />
                                    </svg>
                                    <span>Kayloo Immobilier Rue des Palmiers, Quartier des Almadies Dakar,
                                        Sénégal</span>
                                </a>
                            </li>
                            <li>
                                <a href="mailto:contact@kayloo.immo"
                                    class="flex items-center gap-3 text-white no-underline hover:text-hover-blue transition text-base">
                                    <svg class="w-[17px] h-[17px] flex-shrink-0" viewBox="0 0 512 512"
                                        fill="currentColor">
                                        <path
                                            d="M256 8C118.941 8 8 118.919 8 256c0 137.059 110.919 248 248 248 48.154 0 95.342-14.14 135.408-40.223 12.005-7.815 14.625-24.288 5.552-35.372l-10.177-12.433c-7.671-9.371-21.179-11.667-31.373-5.129C325.92 429.757 291.314 440 256 440c-101.458 0-184-82.542-184-184S154.542 72 256 72c100.139 0 184 57.619 184 160 0 38.786-21.093 79.742-58.17 83.693-17.349-.454-16.91-12.857-13.476-30.024l23.433-121.11C394.653 149.75 383.308 136 368.225 136h-44.981a13.518 13.518 0 0 0-13.432 11.993l-.01.092c-14.697-17.901-40.448-21.775-59.971-21.775-74.58 0-137.831 62.234-137.831 151.46 0 65.303 36.785 105.87 96 105.87 26.984 0 57.369-15.637 74.991-38.333 9.522 34.104 40.613 34.103 70.71 34.103C462.609 379.41 504 307.798 504 232 504 95.653 394.023 8 256 8zm-21.68 304.43c-22.249 0-36.07-15.623-36.07-40.771 0-44.993 30.779-72.729 58.63-72.729 22.292 0 35.601 15.241 35.601 40.77 0 45.061-33.875 72.73-58.161 72.73z" />
                                    </svg>
                                    <span>contact@kayloo.immo</span>
                                </a>
                            </li>
                            <li>
                                <a href="tel:+22133888990"
                                    class="flex items-center gap-3 text-white no-underline hover:text-hover-blue transition text-base">
                                    <svg class="w-[17px] h-[17px] flex-shrink-0" viewBox="0 0 512 512"
                                        fill="currentColor">
                                        <path
                                            d="M497.39 361.8l-112-48a24 24 0 0 0-28 6.9l-49.6 60.6A370.66 370.66 0 0 1 130.6 204.11l60.6-49.6a23.94 23.94 0 0 0 6.9-28l-48-112A24.16 24.16 0 0 0 122.6.61l-104 24A24 24 0 0 0 0 48c0 256.5 207.9 464 464 464a24 24 0 0 0 23.4-18.6l24-104a24.29 24.29 0 0 0-14.01-27.6z" />
                                    </svg>
                                    <span>+221 33 888 99 00</span>
                                </a>
                            </li>
                        </ul>
                    </div>

                    <!-- Right: Contact form (darker panel) -->
                    <div class="flex-1 bg-contact-right p-[8%] lg:p-[4%] w-full lg:w-1/2">
                        <form class="space-y-4">
                            <div class="grid grid-cols-1 gap-4">
                                <div>
                                    <label class="block text-white text-sm mb-1.5">Prénom(s) & Nom</label>
                                    <input type="text" name="prenom" required
                                        class="w-full px-2 py-1.5 bg-white/10 border border-white/20 text-white rounded placeholder-white/50 outline-none focus:border-white/50 transition">
                                </div>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-white text-sm mb-1.5">Email</label>
                                    <input type="email" name="email" required
                                        class="w-full px-2 py-1.5 bg-white/10 border border-white/20 text-white rounded placeholder-white/50 outline-none focus:border-white/50 transition">
                                </div>
                                <div>
                                    <label class="block text-white text-sm mb-1.5">Téléphone</label>
                                    <input type="tel" name="telephone"
                                        class="w-full px-2 py-1.5 bg-white/10 border border-white/20 text-white rounded placeholder-white/50 outline-none focus:border-white/50 transition">
                                </div>
                            </div>
                            <div>
                                <label class="block text-white text-sm mb-1.5">Pays de résidence</label>
                                <input type="text" name="pays"
                                    class="w-full px-2 py-1.5 bg-white/10 border border-white/20 text-white rounded placeholder-white/50 outline-none focus:border-white/50 transition">
                            </div>
                            <div>
                                <label class="block text-white text-sm mb-1.5">Message</label>
                                <textarea name="message" rows="3" required
                                    class="w-full px-2 py-1.5 bg-white/10 border border-white/20 text-white rounded placeholder-white/50 outline-none focus:border-white/50 transition resize-y"></textarea>
                            </div>
                            <button type="submit"
                                class="bg-primary text-white font-poppins text-[15px] font-semibold rounded-[5px] px-8 py-3 border-0 cursor-pointer hover:bg-primary-hover transition">
                                Envoyer
                            </button>
                        </form>
                    </div>

                </div>
            </div>
        </section>
{% endmacro %}
