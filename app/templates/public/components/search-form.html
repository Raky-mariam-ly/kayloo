{% macro search_feature() %}
<div class="max-w-full w-full lg:max-w-[90%] mx-auto mt-6">
  <form id="search-form" action="{{ url_for('get_search_result') }}" method="GET">
    <div class="flex flex-row gap-1 z-2 justify-center" id="contract-button-group">
      <label class="flex text-left">
        <input type="radio" id="radio-vente" name="listing_type" value="vente" class="hidden peer" checked>
        <div
          class="cursor-pointer text-center rounded-t-lg bg-neutral-500/15 backdrop-blur-md border-t border-x text-neutral-100 border-white/10 peer-checked:bg-white peer-checked:text-primary transition-all text-xs md:text-sm font-bold px-3.5 py-3 md:px-6 md:py-3">
          Vente
        </div>
      </label>

      <label class="flex text-left">
        <input type="radio" id="radio-location" name="listing_type" value="location" class="hidden peer">
        <div
          class="cursor-pointer text-center rounded-t-lg bg-neutral-500/15 backdrop-blur-md border-t border-x text-neutral-100 border-white/10 peer-checked:bg-white peer-checked:text-primary transition-all text-xs md:text-sm font-bold px-3.5 py-3 md:px-6 md:py-3">
          Location
        </div>
      </label>

      <label class="flex text-left ">
        <input type="radio" id="radio-meublee" name="listing_type" value="meublee" class="hidden peer">
        <div
          class="cursor-pointer text-center rounded-t-lg bg-neutral-500/15 backdrop-blur-md border-t border-x text-neutral-100 border-white/10 peer-checked:bg-white peer-checked:text-primary transition-all text-xs md:text-sm font-bold px-3.5 py-3 md:px-6 md:py-3">
          Location meublée
        </div>
      </label>
    </div>
    <div
      class="box-border bg-neutral-200/25 backdrop-blur-md border border-white/20 shadow-xl flex flex-wrap gap-2 p-4 font-jakarta items-end rounded-xl z-3">
      <div class="flex flex-col basis-full box-border md:flex-1">
        <label for="property-type" class="text-xs font-semibold text-neutral-300 uppercase mb-1 text-left">
          Type de bien
        </label>
        <select id="property-type" name="property-type"
          class="border px-2 py-1.5 rounded-md text-neutral-50 bg-white/5 border-white/20 text-sm">
          <option value="villa" class="text-neutral-800">Villas</option>
          <option value="appartement" class="text-neutral-800">Appartements</option>
          <option value="terrain" class="text-neutral-800">Terrains</option>
          <option value="bureau" class="text-neutral-800">bureaux</option>
          <option value="chambre" class="text-neutral-800">Chambres</option>
          <option value="studio" class="text-neutral-800">Studios</option>
          <option value="terrain-agricole" class="text-neutral-800">Terrains Agricoles</option>
        </select>
      </div>
      <div class="grid grid-cols-2 gap-2 basis-full md:flex-2"">
                        <div class=" flex flex-col">
        <label for="country" class="text-xs font-semibold text-neutral-300 uppercase mb-1 text-left">Pays</label>
        <select id="country" name="country"
          class="border px-2 py-1.5 rounded-md text-neutral-50 bg-white/5 border-white/20 text-sm">
          <option value="sn" class="text-neutral-800">Sénégal</option>
          <option value="ci" class="text-neutral-800">Côte d'Ivoire</option>
          <option value="ma" class="text-neutral-800">Maroc</option>
          <option value="ng" class="text-neutral-800">Nigeria</option>
          <option value="gn" class="text-neutral-800">Guinée</option>
          <option value="ml" class="text-neutral-800">Mali</option>
          <option value="bf" class="text-neutral-800">Burkina Faso</option>
        </select>
      </div>
      <div class="flex flex-col">
        <label for="city" class="text-xs font-semibold text-neutral-300 uppercase mb-1 text-left">
          Ville</label>
        <select id="city" name="city"
          class="border px-2 py-1.5 rounded-md text-neutral-50 bg-white/5 border-white/20 text-sm">
          <option value="">Chargement...</option>
        </select>
      </div>
    </div>
    <div class="flex flex-col basis-full box-border md:flex-1">
      <label id="price-label" for="max-price" class="text-xs font-semibold text-neutral-300 uppercase mb-1 text-left">
        Prix de vente maximum
      </label>
      <input type="number" id="max-price" name="max_price" placeholder="Ex: 50 000 000"
        class="border px-2 py-1.5 rounded-md text-neutral-50 bg-white/5 border-white/20 text-sm">
    </div>
    <button type="submit"
      class="flex flex-1 basis-[100%] md:basis-1 bg-primary text-white font-jakarta font-bold text-sm items-center justify-center gap-1 rounded-lg h-8.5 mt-2 md:mt-0"><i
        class="fa-solid fa-search"></i>Recherche</button>
</div>

</form>
</div>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    // 1. DATA STRUCTURES
    const rules = {
      "vente": {
        "label": "Prix de vente max",
        "placeholder": "50 000 000",
        "allowed": ["villa", "terrain", "appartement", "bureau", "terrain-agricole"]
      },
      "location": {
        "label": "Loyer max",
        "placeholder": "250 000",
        "allowed": ["villa", "appartement", "bureau", "chambre", "terrain-agricole"]
      },
      "meublee": {
        "label": "Loyer max (par jour)",
        "placeholder": "40 000",
        "allowed": ["villa", "appartement", "studio"]
      }
    };

    const geo_rules = {
      "sn": [
        { "label": "Dakar", "value": "sn-dk" },
        { "label": "Keur Massar", "value": "sn-km" },
        { "label": "Diamniadio", "value": "sn-dm" },
        { "label": "Saly", "value": "sn-sl" },
        { "label": "Saint-Louis", "value": "sn-st" },
        { "label": "Thiès", "value": "sn-th" },
        { "label": "Ziguinchor", "value": "sn-zg" }
      ],
      "ci": [
        { "label": "Abidjan", "value": "ci-ab" },
        { "label": "Yamoussoukro", "value": "ci-ya" },
        { "label": "San-Pédro", "value": "ci-sp" },
        { "label": "Bouaké", "value": "ci-bk" },
        { "label": "Assinie", "value": "ci-as" },
        { "label": "Grand-Bassam", "value": "ci-gb" }
      ],
      "ma": [
        { "label": "Casablanca", "value": "ma-cs" },
        { "label": "Marrakech", "value": "ma-mr" },
        { "label": "Rabat", "value": "ma-rb" },
        { "label": "Tanger", "value": "ma-tg" },
        { "label": "Agadir", "value": "ma-ag" }
      ],
      "ng": [
        { "label": "Lagos", "value": "ng-lg" },
        { "label": "Abuja", "value": "ng-ab" },
        { "label": "Port Harcourt", "value": "ng-ph" },
        { "label": "Ibadan", "value": "ng-ib" }
      ],
      "gn": [
        { "label": "Conakry", "value": "gn-ck" },
        { "label": "Kindia", "value": "gn-kn" },
        { "label": "Boké", "value": "gn-bk" },
        { "label": "Kamsar", "value": "gn-ks" }
      ],
      "ml": [
        { "label": "Bamako", "value": "ml-bm" },
        { "label": "Sikasso", "value": "ml-sk" },
        { "label": "Kayes", "value": "ml-ky" }
      ],
      "bf": [
        { "label": "Ouagadougou", "value": "bf-ou" },
        { "label": "Bobo-Dioulasso", "value": "bf-bd" },
        { "label": "Koudougou", "value": "bf-kd" }
      ]
    };

    // 2. DOM SELECTORS
    const listing_typeRadios = document.querySelectorAll('input[name="listing_type"]');
    const propertySelect = document.getElementById('property-type');
    const countrySelect = document.getElementById('country');
    const citySelect = document.getElementById('city');
    const priceLabel = document.getElementById('price-label');
    const priceInput = document.getElementById('max-price');

    // 3. LOGIC FUNCTIONS

    // Function A: Handle Contract Changes (Property types & Pricing UI)
    const applyRules = (listing_typeType) => {
      const config = rules[listing_typeType];

      // Update Label and Placeholder
      priceLabel.textContent = config.label;
      priceInput.placeholder = config.placeholder;

      // Filter Property Types
      Array.from(propertySelect.options).forEach(opt => {
        const isAllowed = config.allowed.includes(opt.value);
        opt.hidden = !isAllowed;
        opt.disabled = !isAllowed;
      });

      // Safety reset if current selection becomes hidden
      if (propertySelect.selectedOptions[0]?.hidden) {
        propertySelect.value = config.allowed[0];
      }
    };

    // Function B: Handle Country Changes (City injection)
    const updateCities = (countryCode) => {
      citySelect.innerHTML = '<option value="" class="text-neutral-800">Toutes les villes</option>';
      const cities = geo_rules[countryCode];

      if (cities) {
        cities.forEach(city => {
          const opt = document.createElement('option');
          opt.value = city.value;
          opt.textContent = city.label;
          opt.classList.add('text-neutral-800');
          citySelect.appendChild(opt);
        });
      }
    };

    // 4. EVENT LISTENERS
    listing_typeRadios.forEach(radio => {
      radio.addEventListener('change', (e) => applyRules(e.target.value));
    });

    countrySelect.addEventListener('change', (e) => updateCities(e.target.value));

    // 5. INITIALIZATION (Sync UI on Page Load)
    const activelisting_type = document.querySelector('input[name="listing_type"]:checked').value;
    applyRules(activelisting_type);
    updateCities(countrySelect.value);
  });
</script>
{% endmacro %}
