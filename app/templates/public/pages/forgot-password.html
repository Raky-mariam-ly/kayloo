{% extends "base.html" %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
    <div
        class="w-full max-w-[480px] bg-white rounded-[11px] shadow-[0_20px_60px_rgba(0,0,0,0.1)] overflow-hidden border border-border-light">
        <div class="h-1.5 bg-primary w-full"></div>

        <div class="p-8">
            <div class="text-center mb-6">
                <h1 class="font-poppins text-2xl font-bold text-dark">Mot de passe oublié ?</h1>
                <p class="mt-2 text-sm text-muted">Entrez votre adresse e-mail et nous vous enverrons un lien sécurisé
                    pour réinitialiser votre mot de passe.</p>
            </div>

            <form method="POST" class="space-y-4">
                <div>
                    <label for="reset-email" class="block font-poppins text-sm font-medium text-dark mb-1">Adresse
                        e-mail</label>
                    <input type="email" id="reset-email" name="email" required placeholder="exemple@email.com"
                        class="w-full rounded-[5px] border border-border-input bg-white px-4 py-2.5 text-sm text-dark placeholder:text-input-muted focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20 transition" />
                </div>
                <button type="submit"
                    class="w-full bg-primary hover:bg-primary-hover text-white font-poppins text-[15px] font-semibold rounded-[5px] py-3 transition">
                    Envoyer le lien
                </button>
            </form>

            <div class="mt-6 text-center">
                <!-- ✅ Fixed: hardcoded href for testing -->
                <a href="/" class="text-sm text-primary hover:text-primary-hover font-medium">← Retour à la
                    connexion</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
