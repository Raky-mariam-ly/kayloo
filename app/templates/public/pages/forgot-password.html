{% extends "base.html" %}
{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
    <div class="w-full max-w-[480px] bg-white rounded-[11px] shadow-[0_20px_60px_rgba(0,0,0,0.1)] overflow-hidden border border-border-light">
        <div class="h-1.5 bg-primary w-full"></div>
        <div class="p-8">
            <div class="text-center mb-6">
                <h1 class="font-poppins text-2xl font-bold text-dark">Mot de passe oublié ?</h1>
                <p class="mt-2 text-sm text-muted">Entrez votre adresse e-mail et nous vous enverrons un lien sécurisé pour réinitialiser votre mot de passe.</p>
            </div>

            <div id="fp-error" class="hidden mb-4 px-4 py-2.5 rounded-[5px] bg-red-50 border border-red-200 text-sm text-red-600"></div>
            <div id="fp-success" class="hidden mb-4 px-4 py-2.5 rounded-[5px] bg-green-50 border border-green-200 text-sm text-green-700"></div>

            <form id="fp-form" class="space-y-4" novalidate>
                <div>
                    <label for="reset-email" class="block font-poppins text-sm font-medium text-dark mb-1">Adresse e-mail</label>
                    <input type="email" id="reset-email" name="email" required placeholder="exemple@email.com"
                        class="w-full rounded-[5px] border border-border-input bg-white px-4 py-2.5 text-sm text-dark placeholder:text-input-muted focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20 transition" />
                </div>
                <button id="fp-btn" type="submit"
                    class="w-full bg-primary hover:bg-primary-hover text-white font-poppins text-[15px] font-semibold rounded-[5px] py-3 transition flex items-center justify-center gap-2">
                    Envoyer le lien
                </button>
            </form>

            <div class="mt-6 text-center">
                <a href="/" class="text-sm text-primary hover:text-primary-hover font-medium">← Retour à l'accueil</a>
            </div>
        </div>
    </div>
</div>
<script>
    const fpBtn = document.getElementById('fp-btn');
    fpBtn.dataset.label = 'Envoyer le lien';
    function fpSetLoading(on) {
        fpBtn.disabled = on;
        fpBtn.innerHTML = on
            ? '<svg class="animate-spin h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path></svg>'
            : fpBtn.dataset.label;
    }
    document.getElementById('fp-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        document.getElementById('fp-error').classList.add('hidden');
        document.getElementById('fp-success').classList.add('hidden');
        const email = document.getElementById('reset-email').value.trim();
        if (!email) {
            document.getElementById('fp-error').textContent = 'Veuillez saisir votre adresse e-mail.';
            document.getElementById('fp-error').classList.remove('hidden');
            return;
        }
        fpSetLoading(true);
        try {
            await fetch('/auth/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email }),
            });
            document.getElementById('fp-success').textContent =
                'Si un compte existe avec cet email, un lien de réinitialisation vous a été envoyé.';
            document.getElementById('fp-success').classList.remove('hidden');
            document.getElementById('fp-form').reset();
        } catch {
            document.getElementById('fp-error').textContent = 'Erreur réseau. Veuillez réessayer.';
            document.getElementById('fp-error').classList.remove('hidden');
        } finally {
            fpSetLoading(false);
        }
    });
</script>
{% endblock %}
