{% extends "base.html" %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
    <div
        class="w-full max-w-[480px] bg-white rounded-[11px] shadow-[0_20px_60px_rgba(0,0,0,0.1)] overflow-hidden border border-border-light">
        <div class="h-1.5 bg-primary w-full"></div>

        <div class="p-8">
            <div class="text-center mb-6">
                <h1 class="font-poppins text-2xl font-bold text-dark">Réinitialiser le mot de passe</h1>
                <p class="mt-2 text-sm text-muted">Créez un nouveau mot de passe sécurisé pour votre compte.</p>
            </div>

            <form id="reset-form" method="POST" class="space-y-4">
                <div>
                    <label for="new-password" class="block font-poppins text-sm font-medium text-dark mb-1">Nouveau mot
                        de passe</label>
                    <div class="relative">
                        <input type="password" id="new-password" name="new_password" required minlength="8"
                            placeholder="8 caractères minimum"
                            class="w-full rounded-[5px] border border-border-input bg-white px-4 py-2.5 pr-10 text-sm text-dark placeholder:text-input-muted focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20 transition" />
                        <button type="button"
                            class="toggle-pwd absolute right-3 top-1/2 -translate-y-1/2 text-input-muted hover:text-dark transition text-sm"
                            aria-label="Afficher le mot de passe">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div>
                    <label for="confirm-password"
                        class="block font-poppins text-sm font-medium text-dark mb-1">Confirmer le mot de passe</label>
                    <div class="relative">
                        <input type="password" id="confirm-password" name="confirm_password" required minlength="8"
                            placeholder="••••••••"
                            class="w-full rounded-[5px] border border-border-input bg-white px-4 py-2.5 pr-10 text-sm text-dark placeholder:text-input-muted focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20 transition" />
                        <button type="button"
                            class="toggle-pwd absolute right-3 top-1/2 -translate-y-1/2 text-input-muted hover:text-dark transition text-sm"
                            aria-label="Afficher le mot de passe">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <p id="pwd-error" class="hidden text-xs text-primary mt-1">Les mots de passe ne correspondent pas.
                    </p>
                </div>

                <button type="submit"
                    class="w-full bg-primary hover:bg-primary-hover text-white font-poppins text-[15px] font-semibold rounded-[5px] py-3 transition mt-2">
                    Réinitialiser le mot de passe
                </button>
            </form>
        </div>
    </div>
</div>

<script>
    document.querySelectorAll('.toggle-pwd').forEach(btn => {
        btn.addEventListener('click', () => {
            const input = btn.previousElementSibling;
            const icon = btn.querySelector('i');
            const isPwd = input.type === 'password';
            input.type = isPwd ? 'text' : 'password';
            icon.classList.toggle('fa-eye', !isPwd);
            icon.classList.toggle('fa-eye-slash', isPwd);
        });
    });

    document.getElementById('reset-form').addEventListener('submit', function (e) {
        const pwd = document.getElementById('new-password').value;
        const confirm = document.getElementById('confirm-password').value;
        const err = document.getElementById('pwd-error');
        if (pwd !== confirm) {
            e.preventDefault();
            err.classList.remove('hidden');
        } else {
            err.classList.add('hidden');
        }
    });
</script>
{% endblock %}
