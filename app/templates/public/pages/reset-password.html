{% extends "base.html" %}
{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
    <div class="w-full max-w-[480px] bg-white rounded-[11px] shadow-[0_20px_60px_rgba(0,0,0,0.1)] overflow-hidden border border-border-light">
        <div class="h-1.5 bg-primary w-full"></div>
        <div class="p-8">
            <div class="text-center mb-6">
                <h1 class="font-poppins text-2xl font-bold text-dark">Réinitialiser le mot de passe</h1>
                <p class="mt-2 text-sm text-muted">Créez un nouveau mot de passe sécurisé pour votre compte.</p>
            </div>

            <div id="rp-error" class="hidden mb-4 px-4 py-2.5 rounded-[5px] bg-red-50 border border-red-200 text-sm text-red-600"></div>
            <div id="rp-success" class="hidden mb-4 px-4 py-2.5 rounded-[5px] bg-green-50 border border-green-200 text-sm text-green-700"></div>
            <div id="rp-token-error" class="hidden mb-4 px-4 py-2.5 rounded-[5px] bg-yellow-50 border border-yellow-200 text-sm text-yellow-700">
                Lien invalide ou expiré. <a href="/mot-de-passe-oublie" class="underline font-medium">Demander un nouveau lien</a>.
            </div>

            <form id="rp-form" class="space-y-4" novalidate>
                <div>
                    <label for="new-password" class="block font-poppins text-sm font-medium text-dark mb-1">Nouveau mot de passe</label>
                    <div class="relative">
                        <input type="password" id="new-password" required minlength="8" placeholder="8 caractères minimum"
                            class="w-full rounded-[5px] border border-border-input bg-white px-4 py-2.5 pr-10 text-sm text-dark placeholder:text-input-muted focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20 transition" />
                        <button type="button" class="toggle-pwd absolute right-3 top-1/2 -translate-y-1/2 text-input-muted hover:text-dark transition text-sm" aria-label="Afficher">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <div>
                    <label for="confirm-password" class="block font-poppins text-sm font-medium text-dark mb-1">Confirmer le mot de passe</label>
                    <div class="relative">
                        <input type="password" id="confirm-password" required minlength="8" placeholder="••••••••"
                            class="w-full rounded-[5px] border border-border-input bg-white px-4 py-2.5 pr-10 text-sm text-dark placeholder:text-input-muted focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20 transition" />
                        <button type="button" class="toggle-pwd absolute right-3 top-1/2 -translate-y-1/2 text-input-muted hover:text-dark transition text-sm" aria-label="Afficher">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <button id="rp-btn" type="submit"
                    class="w-full bg-primary hover:bg-primary-hover text-white font-poppins text-[15px] font-semibold rounded-[5px] py-3 transition mt-2 flex items-center justify-center gap-2">
                    Réinitialiser le mot de passe
                </button>
            </form>
        </div>
    </div>
</div>
<script>
    // Read token from URL (?token=xxx)
    const _rpToken = new URLSearchParams(window.location.search).get('token');
    if (!_rpToken) {
        document.getElementById('rp-token-error').classList.remove('hidden');
        document.getElementById('rp-form').classList.add('hidden');
    }

    document.querySelectorAll('.toggle-pwd').forEach(btn => {
        btn.addEventListener('click', () => {
            const input = btn.previousElementSibling;
            const icon = btn.querySelector('i');
            const isPwd = input.type === 'password';
            input.type = isPwd ? 'text' : 'password';
            icon.classList.toggle('fa-eye', !isPwd);
            icon.classList.toggle('fa-eye-slash', isPwd);
        });
    });

    const rpBtn = document.getElementById('rp-btn');
    rpBtn.dataset.label = 'Réinitialiser le mot de passe';
    function rpSetLoading(on) {
        rpBtn.disabled = on;
        rpBtn.innerHTML = on
            ? '<svg class="animate-spin h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path></svg>'
            : rpBtn.dataset.label;
    }

    const RESET_ERRORS = {
        'RESET_PASSWORD_BAD_TOKEN': 'Lien invalide ou expiré.',
        'RESET_PASSWORD_INVALID_PASSWORD': 'Le mot de passe doit contenir au moins 8 caractères.',
    };

    document.getElementById('rp-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        document.getElementById('rp-error').classList.add('hidden');
        const password = document.getElementById('new-password').value;
        const confirm  = document.getElementById('confirm-password').value;

        if (password !== confirm) {
            document.getElementById('rp-error').textContent = 'Les mots de passe ne correspondent pas.';
            document.getElementById('rp-error').classList.remove('hidden');
            return;
        }
        if (password.length < 8) {
            document.getElementById('rp-error').textContent = 'Le mot de passe doit contenir au moins 8 caractères.';
            document.getElementById('rp-error').classList.remove('hidden');
            return;
        }

        rpSetLoading(true);
        try {
            const res = await fetch('/auth/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: _rpToken, password }),
            });
            if (res.ok) {
                document.getElementById('rp-form').classList.add('hidden');
                document.getElementById('rp-success').textContent =
                    'Mot de passe réinitialisé avec succès ! Redirection…';
                document.getElementById('rp-success').classList.remove('hidden');
                setTimeout(() => { window.location.href = '/'; }, 2000);
            } else {
                const data = await res.json().catch(() => ({}));
                const detail = typeof data.detail === 'string' ? data.detail : '';
                document.getElementById('rp-error').textContent =
                    RESET_ERRORS[detail] || 'Une erreur est survenue. Veuillez réessayer.';
                document.getElementById('rp-error').classList.remove('hidden');
            }
        } catch {
            document.getElementById('rp-error').textContent = 'Erreur réseau. Veuillez réessayer.';
            document.getElementById('rp-error').classList.remove('hidden');
        } finally {
            rpSetLoading(false);
        }
    });
</script>
{% endblock %}
