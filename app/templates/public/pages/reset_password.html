<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nouveau mot de passe – Kayloo</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      background: #f4f4f4;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,.10);
      width: 100%; max-width: 420px;
      padding: 40px 36px;
      margin: 24px;
    }
    .logo {
      text-align: center;
      margin-bottom: 28px;
    }
    .logo span {
      font-size: 26px; font-weight: 700; color: #a80000; letter-spacing: .5px;
    }
    h1 {
      font-size: 1.2rem; font-weight: 700; color: #1a1a2e;
      margin: 0 0 6px; text-align: center;
    }
    .subtitle {
      font-size: .84rem; color: #868e96;
      text-align: center; margin: 0 0 28px;
    }
    label {
      display: block; font-size: .8rem; font-weight: 600;
      color: #495057; margin-bottom: 5px;
    }
    .input-wrap {
      position: relative; margin-bottom: 16px;
    }
    .input-wrap input {
      width: 100%; padding: .62rem .95rem .62rem 2.5rem;
      border: 1px solid #dee2e6; border-radius: 6px;
      font-size: .92rem; color: #1a1a2e; outline: none;
      transition: border-color .15s;
    }
    .input-wrap input:focus { border-color: #a80000; }
    .input-wrap i {
      position: absolute; left: .85rem; top: 50%;
      transform: translateY(-50%);
      color: #adb5bd; font-size: .88rem;
    }
    .input-wrap .toggle-pw {
      position: absolute; right: .85rem; top: 50%;
      transform: translateY(-50%);
      cursor: pointer; color: #adb5bd; font-size: .88rem; left: auto;
    }
    .btn {
      width: 100%; padding: .75rem;
      background: #a80000; color: #fff;
      border: none; border-radius: 6px;
      font-size: .95rem; font-weight: 700; cursor: pointer;
      transition: background .15s;
      display: flex; align-items: center; justify-content: center; gap: .5rem;
    }
    .btn:hover { background: #8b0000; }
    .btn:disabled { background: #c97a7a; cursor: not-allowed; }

    .alert {
      border-radius: 6px; padding: .65rem 1rem;
      font-size: .85rem; margin-bottom: 16px;
      display: none;
    }
    .alert.show { display: block; }
    .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .alert-error   { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

    .hint {
      font-size: .76rem; color: #adb5bd;
      margin: 4px 0 0; display: block;
    }
    .strength-bar {
      height: 4px; border-radius: 2px; margin-top: 6px;
      background: #e9ecef; overflow: hidden;
    }
    .strength-bar-fill {
      height: 100%; border-radius: 2px;
      transition: width .2s, background .2s;
      width: 0%;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="logo"><span>KAYLOO</span></div>
  <h1>Nouveau mot de passe</h1>
  <p class="subtitle">Choisissez un mot de passe sécurisé pour votre compte.</p>

  <div class="alert alert-success" id="msg-success">
    <i class="fa fa-check-circle me-1"></i>
    Mot de passe mis à jour. Vous pouvez maintenant vous connecter.
    <br><a href="/admin/login" style="color:#155724;font-weight:600;">Aller à la connexion</a>
  </div>
  <div class="alert alert-error" id="msg-error"></div>

  <form id="resetForm" novalidate>
    <input type="hidden" id="token" value="{{ token }}">

    <div>
      <label for="password">Nouveau mot de passe</label>
      <div class="input-wrap">
        <i class="fa fa-lock"></i>
        <input type="password" id="password" name="password"
               placeholder="Minimum 8 caractères" autocomplete="new-password">
        <i class="fa fa-eye toggle-pw" onclick="togglePw('password', this)"></i>
      </div>
      <div class="strength-bar"><div class="strength-bar-fill" id="str-fill"></div></div>
      <span class="hint" id="str-label"></span>
    </div>

    <div style="margin-top:16px;">
      <label for="confirm">Confirmer le mot de passe</label>
      <div class="input-wrap">
        <i class="fa fa-lock"></i>
        <input type="password" id="confirm" name="confirm"
               placeholder="Répéter le mot de passe" autocomplete="new-password">
        <i class="fa fa-eye toggle-pw" onclick="togglePw('confirm', this)"></i>
      </div>
    </div>

    <button type="submit" class="btn" id="submitBtn" style="margin-top:24px;">
      <i class="fa fa-key"></i> Enregistrer le mot de passe
    </button>
  </form>
</div>

<script>
(function () {
  /* ── Toggle visibilité mot de passe ── */
  window.togglePw = function (id, icon) {
    var input = document.getElementById(id);
    var show  = input.type === 'password';
    input.type = show ? 'text' : 'password';
    icon.className = (show ? 'fa fa-eye-slash' : 'fa fa-eye') + ' toggle-pw';
  };

  /* ── Indicateur de force ── */
  document.getElementById('password').addEventListener('input', function () {
    var v = this.value;
    var score = 0;
    if (v.length >= 8)  score++;
    if (/[A-Z]/.test(v)) score++;
    if (/[0-9]/.test(v)) score++;
    if (/[^A-Za-z0-9]/.test(v)) score++;

    var fill   = document.getElementById('str-fill');
    var label  = document.getElementById('str-label');
    var colors = ['#dc3545','#fd7e14','#ffc107','#28a745'];
    var labels = ['Très faible','Faible','Moyen','Fort'];

    fill.style.width     = (score * 25) + '%';
    fill.style.background = colors[score - 1] || '#e9ecef';
    label.textContent    = v.length ? labels[score - 1] || '' : '';
  });

  /* ── Soumission ── */
  document.getElementById('resetForm').addEventListener('submit', async function (e) {
    e.preventDefault();

    var token   = document.getElementById('token').value;
    var pw      = document.getElementById('password').value.trim();
    var confirm = document.getElementById('confirm').value.trim();
    var errEl   = document.getElementById('msg-error');
    var sucEl   = document.getElementById('msg-success');
    var btn     = document.getElementById('submitBtn');

    errEl.classList.remove('show');
    sucEl.classList.remove('show');

    if (!pw) {
      errEl.textContent = 'Veuillez saisir un mot de passe.';
      return errEl.classList.add('show');
    }
    if (pw.length < 8) {
      errEl.textContent = 'Le mot de passe doit comporter au moins 8 caractères.';
      return errEl.classList.add('show');
    }
    if (pw !== confirm) {
      errEl.textContent = 'Les mots de passe ne correspondent pas.';
      return errEl.classList.add('show');
    }
    if (!token) {
      errEl.textContent = 'Lien invalide ou expiré. Demandez un nouveau lien.';
      return errEl.classList.add('show');
    }

    btn.disabled = true;
    btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Enregistrement…';

    try {
      var res = await fetch('/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: token, password: pw }),
      });

      if (res.ok) {
        document.getElementById('resetForm').style.display = 'none';
        sucEl.classList.add('show');
      } else {
        var body = await res.json().catch(() => ({}));
        var detail = body.detail || '';
        if (typeof detail === 'object') detail = detail.reason || JSON.stringify(detail);
        errEl.textContent = detail === 'RESET_PASSWORD_BAD_TOKEN'
          ? 'Lien invalide ou expiré. Demandez un nouveau lien de réinitialisation.'
          : (detail || 'Une erreur est survenue. Veuillez réessayer.');
        errEl.classList.add('show');
        btn.disabled = false;
        btn.innerHTML = '<i class="fa fa-key"></i> Enregistrer le mot de passe';
      }
    } catch (err) {
      errEl.textContent = 'Erreur réseau. Veuillez réessayer.';
      errEl.classList.add('show');
      btn.disabled = false;
      btn.innerHTML = '<i class="fa fa-key"></i> Enregistrer le mot de passe';
    }
  });
})();
</script>
</body>
</html>
